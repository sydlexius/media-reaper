version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "deps"
    labels:
      - dependencies
      - go
    open-pull-requests-limit: 10

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "ci"
    labels:
      - dependencies
      - ci
    open-pull-requests-limit: 5
    groups:
      # github/codeql-action/* sub-actions MUST bump together. init writes a
      # config file that analyze reads, and the two refuse to talk across a
      # version boundary ("Loaded a configuration file for version X, but
      # running version Y"). Bumping them in separate PRs leaves main red from
      # the moment the first merges until the second does.
      codeql-action:
        patterns:
          - "github/codeql-action*"
      actions-all:
        patterns:
          - "*"
        exclude-patterns:
          - "github/codeql-action*"

  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "docker"
    labels:
      - dependencies
      - docker
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "deps(web)"
    labels:
      - dependencies
      - javascript
    open-pull-requests-limit: 5
    groups:
      vite-ecosystem:
        patterns:
          - "vite"
          - "@vitejs/*"
          - "@tailwindcss/vite"
          - "vitest"
          - "@vitest/*"
      react-ecosystem:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
          - "react-router"
      # typescript belongs here rather than in a group of its own: typescript-eslint
      # declares a peer range on typescript, so bumping either alone gives npm an
      # unsatisfiable tree (ERESOLVE) and the PR can never go green. They move together.
      eslint-ecosystem:
        patterns:
          - "eslint"
          - "eslint-*"
          - "@eslint/*"
          - "typescript"
          - "typescript-eslint"
          - "globals"
      types:
        patterns:
          - "@types/*"
        exclude-patterns:
          - "@types/react"
          - "@types/react-dom"
    ignore:
      # typescript-eslint peers typescript ">=4.8.4 <6.1.0" at every published
      # version, alphas included, so TypeScript 7 cannot resolve alongside it.
      # Dependabot re-proposes the bump weekly and it can never go green. Drop
      # this ignore once typescript-eslint ships TS 7 support.
      - dependency-name: "typescript"
        versions: [">=6.1.0"]

